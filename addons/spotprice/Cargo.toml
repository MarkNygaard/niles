[package]
name = "spotprice"
version = "0.1.0" # x-release-please-version
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Danish electricity spot prices for Niles."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
