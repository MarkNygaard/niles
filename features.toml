[[feature]]
id = "api-get-devices"
category = "api.read"
summary = "GET /devices returns the full device registry snapshot"
since_pr = 13

[[feature]]
id = "api-get-room"
category = "api.read"
summary = "GET /rooms/{room} returns the devices in a single room"
