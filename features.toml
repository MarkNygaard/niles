[[feature]]
id = "tool-light-control"
category = "llm.tools"
summary = "Turn lights on or off and set brightness or color temperature"
since_pr = 3

[[feature]]
id = "tool-scene-control"
category = "llm.tools"
summary = "Apply or delete saved scenes via structured tool calls"
