[preamble]
text = """
Niles is an AI-first home-automation system for private homes. It listens to natural-language voice commands, dispatches them through a tiered intent router, and can escalate to an LLM when a request exceeds the deterministic tier. The feature catalog below tracks every user-observable capability shipped so far. For the full architecture spec see ARCHITECTURE.md.
"""

[[feature]]
id = "light-on-off"
category = "voice.lighting"
summary = "Turn a single light on or off by room and name"
phrasings = ["turn on the kitchen light", "switch off the bedroom lamp"]
since_pr = 3

[[feature]]
id = "light-brightness"
category = "voice.lighting"
summary = "Set a light's brightness to a specific percent"
phrasings = ["set the living room light to 50 percent", "dim the hallway to twenty percent"]
since_pr = 25

[[feature]]
id = "light-step"
category = "voice.lighting"
summary = "Step a light brighter or dimmer by one increment"
phrasings = ["make it brighter", "dim the light a little"]
since_pr = 27

[[feature]]
id = "light-temp-step"
category = "voice.lighting"
summary = "Step a light warmer or cooler by one color-temperature increment"
phrasings = ["make it warmer", "cool down the light"]
since_pr = 72

[[feature]]
id = "light-named-white"
category = "voice.lighting"
summary = "Set a light to a named white such as warm or cool"
phrasings = ["set the light to warm white", "switch to cool white"]
since_pr = 74

[[feature]]
id = "light-all-on-off"
category = "voice.lighting"
summary = "Turn all lights in a room on or off at once"
phrasings = ["turn on all the lights", "switch everything off"]
since_pr = 3

[[feature]]
id = "light-all-brightness"
category = "voice.lighting"
summary = "Set brightness for every light in a room simultaneously"
phrasings = ["set all lights to 75 percent"]
since_pr = 25

[[feature]]
id = "light-all-temp"
category = "voice.lighting"
summary = "Set color temperature for every light in a room simultaneously"
phrasings = ["make all the lights warmer"]
since_pr = 72

[[feature]]
id = "scene-save"
category = "voice.scenes"
summary = "Save the current device states as a named scene"
phrasings = ["save this as movie mode", "remember this scene as dinner"]
since_pr = 43

[[feature]]
id = "scene-apply"
category = "voice.scenes"
summary = "Restore a previously saved scene by name"
phrasings = ["activate movie mode", "set the scene to dinner"]
since_pr = 43

[[feature]]
id = "scene-list"
category = "voice.scenes"
summary = "List all saved scenes"
phrasings = ["what scenes do we have", "list my scenes"]
since_pr = 45

[[feature]]
id = "scene-delete"
category = "voice.scenes"
summary = "Delete a saved scene by name"
phrasings = ["delete the dinner scene", "remove movie mode"]
since_pr = 45

[[feature]]
id = "media-play-pause"
category = "voice.media"
summary = "Play or pause media playback on the active speaker"
phrasings = ["play music", "pause the music"]
since_pr = 65

[[feature]]
id = "media-volume-set"
category = "voice.media"
summary = "Set the speaker volume to a specific level"
phrasings = ["set the volume to thirty", "turn the music down to ten"]
since_pr = 65

[[feature]]
id = "media-volume-step"
category = "voice.media"
summary = "Raise or lower the speaker volume by one step"
phrasings = ["turn it up", "make it quieter"]
since_pr = 65

[[feature]]
id = "media-next-previous"
category = "voice.media"
summary = "Skip to the next or previous track"
phrasings = ["next song", "previous track"]
since_pr = 75

[[feature]]
id = "media-duck"
category = "voice.media"
summary = "Temporarily lower volume for voice responses"
phrasings = ["duck the music", "lower the music while you speak"]
since_pr = 73

[[feature]]
id = "timer-set"
category = "voice.timers"
summary = "Set a timer for a given duration"
phrasings = ["set a timer for five minutes", "timer ten minutes"]
since_pr = 3

[[feature]]
id = "timer-cancel"
category = "voice.timers"
summary = "Cancel an active timer by name or duration"
phrasings = ["cancel the five minute timer", "stop the timer"]
since_pr = 3

[[feature]]
id = "timer-list"
category = "voice.timers"
summary = "List all currently active timers"
phrasings = ["what timers are running", "list my timers"]
since_pr = 3

[[feature]]
id = "memory-add"
category = "voice.memory"
summary = "Append a note to the user's persistent memory"
phrasings = ["remember that I like the lights dim", "add to my memory"]
since_pr = 77

[[feature]]
id = "memory-replace"
category = "voice.memory"
summary = "Replace an existing memory entry"
phrasings = ["update my memory to say I prefer warm white"]
since_pr = 77

[[feature]]
id = "memory-remove"
category = "voice.memory"
summary = "Remove a note from the user's persistent memory"
phrasings = ["forget that I like dim lights", "remove from my memory"]
since_pr = 77

[[feature]]
id = "memory-view"
category = "voice.memory"
summary = "Show the contents of the user's persistent memory"
phrasings = ["what do you know about me", "read my memory"]
since_pr = 77

[[feature]]
id = "skill-mint"
category = "voice.skills"
summary = "Create a new skill from a natural-language description"
phrasings = ["save this as a skill called bedtime", "mint a skill named movie night"]
