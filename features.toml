[[feature]]
id = "skill-delete"
category = "voice.skills"
summary = "Delete a saved skill by name"
phrasings = ["delete the bedtime skill", "remove movie night"]
since_pr = 78

[[feature]]
id = "skill-view"
category = "voice.skills"
summary = "Read the full body of a saved skill"
phrasings = ["show me the bedtime skill", "what is in movie night"]
