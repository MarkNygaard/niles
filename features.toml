[[feature]]
id = "curve-brightness"
category = "ambient.curve"
summary = "Per-minute adaptive brightness curve based on time of day"
since_pr = 5

[[feature]]
id = "curve-color-temp"
category = "ambient.curve"
summary = "Per-minute adaptive color-temperature curve based on time of day"
since_pr = 7

[[feature]]
id = "curve-morning-routine"
category = "ambient.curve"
summary = "Gradual morning-routine ramp that respects per-room claims"
