[[feature]]
id = "skill-curator"
category = "voice.skills"
summary = "Automatic background transitions for stale and archived skills"
phrasings = ["run the skill curator", "clean up old skills"]
since_pr = 80

[[feature]]
id = "skill-background-review"
category = "voice.skills"
summary = "Review skill suggestions generated in the background"
phrasings = ["review my pending skills", "show background skill suggestions"]
since_pr = 85

[[feature]]
id = "tier-two-escalation"
category = "voice.general"
summary = "Escalate a voice request to the Tier 2 LLM when Tier 0/1 cannot answer"
phrasings = ["ask the smart assistant", "escalate this to tier two"]
since_pr = 87

[[feature]]
id = "tool-weather"
