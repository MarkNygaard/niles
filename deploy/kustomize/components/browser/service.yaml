apiVersion: v1
kind: Service
metadata:
  name: niles-browser
  labels:
    app.kubernetes.io/name: niles-browser
    app.kubernetes.io/part-of: niles
    app.kubernetes.io/component: browser
spec:
  type: ClusterIP
  # Niles finds the browser by this name.
  selector:
    app.kubernetes.io/name: niles-browser
  ports:
    - name: devtools
      port: 9222
      targetPort: devtools
      protocol: TCP
