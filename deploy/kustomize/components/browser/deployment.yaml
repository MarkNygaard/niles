apiVersion: apps/v1
kind: Deployment
metadata:
  name: niles-browser
  labels:
    app.kubernetes.io/name: niles-browser
    app.kubernetes.io/part-of: niles
    app.kubernetes.io/component: browser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: niles-browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: niles-browser
        app.kubernetes.io/part-of: niles
        app.kubernetes.io/component: browser
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The pause container reaps Chromium's zombies.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chromium
          # Pinned by version and digest.
          image: docker.io/chromedp/headless-shell:158.0.8127.18@sha256:830fa77e0602cb42e5cb2cbd9237ba27b649ad69d5fb82b54713aac8b7ab4f29
          # The image's run.sh, kept: Chromium listens on 127.0.0.1:9223
          # whatever --remote-debugging-address says, and run.sh's socat
          # forwards 9222 to it. It also adds --no-sandbox (the container
          # is the sandbox; it has no user namespaces), the debugging
          # address and port, and SwiftShader.
          args:
            - --headless
            - --user-data-dir=/tmp/chromium
            - --window-size=1280,900
            # The browser's own requests outside a session go nowhere;
            # each session gets Niles's proxy.
            - --proxy-server=http://127.0.0.1:9
            - --proxy-bypass-list=<-loopback>
            - --force-webrtc-ip-handling-policy=disable_non_proxied_udp
            - --disable-quic
            - --disable-background-networking
            - --disable-component-update
            - --disable-sync
            - --disable-default-apps
            - --disable-extensions
            - --disable-domain-reliability
            - --disable-client-side-phishing-detection
            - --no-first-run
            - --no-pings
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: devtools
              containerPort: 9222
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          # Chromium itself and the forwarder: either alone answering is a
          # browser Niles can't use.
          readinessProbe:
            exec:
              command: [bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/9223 && exec 4<>/dev/tcp/127.0.0.1/9222']
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/9223 && exec 4<>/dev/tcp/127.0.0.1/9222']
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: dev-shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: dev-shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
