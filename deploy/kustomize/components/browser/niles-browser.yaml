apiVersion: apps/v1
kind: Deployment
metadata:
  name: niles
spec:
  template:
    spec:
      # Niles finds the browser by this name; here it is the pod itself.
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - niles-browser
      containers:
        - name: chromium
          # Pinned by version and digest.
          image: docker.io/chromedp/headless-shell:158.0.8127.18@sha256:830fa77e0602cb42e5cb2cbd9237ba27b649ad69d5fb82b54713aac8b7ab4f29
          # The bare binary rather than the image's run.sh, whose socat
          # would put DevTools on the pod's address. Chromium itself
          # listens on 127.0.0.1 only. It is PID 1 here and waits on its
          # own children; the daily restart clears anything left over.
          command: ["/headless-shell/headless-shell"]
          args:
            # The container is the sandbox; it has no user namespaces.
            - --no-sandbox
            - --headless
            - --remote-debugging-port=9222
            - --user-data-dir=/tmp/chromium
            - --window-size=1280,900
            # The browser's own requests outside a session go nowhere;
            # each session gets Niles's proxy.
            - --proxy-server=http://127.0.0.1:9
            - --proxy-bypass-list=<-loopback>
            - --force-webrtc-ip-handling-policy=disable_non_proxied_udp
            - --disable-quic
            - --disable-background-networking
            - --disable-component-update
            - --disable-sync
            - --disable-default-apps
            - --disable-extensions
            - --disable-domain-reliability
            - --disable-client-side-phishing-detection
            - --no-first-run
            - --no-pings
            - --use-gl=angle
            - --use-angle=swiftshader
          env:
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          # No readiness probe: a pod is ready only when every container
          # is, and a browser that's slow to answer mustn't take Niles out
          # of its Service. A stuck one is restarted on its own.
          livenessProbe:
            exec:
              command: [bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/9222']
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: browser-tmp
              mountPath: /tmp
            - name: browser-shm
              mountPath: /dev/shm
            # The pod's service-account token stays out of this container:
            # with the Update component it may patch Niles's Deployment,
            # and Kubernetes adds no token where a mount already sits.
            - name: browser-no-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: browser-tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: browser-shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: browser-no-token
          emptyDir:
            sizeLimit: 1Mi
