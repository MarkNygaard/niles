apiVersion: apps/v1
kind: Deployment
metadata:
  name: niles
spec:
  template:
    spec:
      containers:
        - name: niles
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              # A Claude Code run for the app's chat peaks around 250Mi
              # on top of Niles itself.
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: niles-data
