apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: niles

resources:
  - ../../base

images:
  - name: ghcr.io/marknygaard/niles
    newName: ghcr.io/marknygaard/niles
    newTag: "0.4.0"

configMapGenerator:
  - name: niles-config
    behavior: replace
    files:
      - niles.toml

patches:
  - path: deployment-prod.yaml

labels:
  - pairs:
      app.kubernetes.io/instance: production
    includeSelectors: true
