apiVersion: apps/v1
kind: Deployment
metadata:
  name: niles
  labels:
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: niles
  template:
    metadata:
      labels:
        app.kubernetes.io/name: niles
        app.kubernetes.io/component: app
    spec:
      containers:
        - name: niles
          # Published by .github/workflows/image.yml, for linux/amd64.
          # Pin a version tag (e.g. :0.4.0) in an overlay for production;
          # :latest is the newest release.
          image: ghcr.io/marknygaard/niles:latest
          imagePullPolicy: Always
          args:
            - serve
            - --config
            - /etc/niles/niles.toml
          ports:
            - name: http-api
              containerPort: 8080
              protocol: TCP
            - name: wyoming
              containerPort: 10300
              protocol: TCP
          env:
            # The database and the key that seals what is typed into the
            # app. The only two Niles always takes from outside.
            - name: NILES_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: database-url
            - name: NILES_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: secret-key
            # What Niles needs before the app is up: the broker's login and
            # the keys for hearing and thinking, named in niles.toml.
            # Optional, for an install that already keeps them in the app.
            - name: NILES_MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: mqtt-username
                  optional: true
            - name: NILES_MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: mqtt-password
                  optional: true
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: elevenlabs-api-key
                  optional: true
            - name: CEREBRAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: cerebras-api-key
                  optional: true
            # Signing in, for a deployment that owns these rather than the
            # app. All optional: the GitHub app's two are read only when
            # `[auth]` names them, and with a database Niles makes and
            # keeps its own session key and API key.
            - name: NILES_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: github-client-id
                  optional: true
            - name: NILES_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: github-client-secret
                  optional: true
            # Changing this signs everybody out, which is also the only
            # way to revoke one device without removing its owner.
            - name: NILES_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: session-secret
                  optional: true
            - name: NILES_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: niles-secrets
                  key: api-token
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-api
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/niles
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: niles-config
