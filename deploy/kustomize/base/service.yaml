apiVersion: v1
kind: Service
metadata:
  name: niles
  labels:
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: niles
  ports:
    - name: http-api
      port: 8080
      targetPort: http-api
      protocol: TCP
    - name: wyoming
      port: 10300
      targetPort: wyoming
      protocol: TCP
