apiVersion: v1
kind: ConfigMap
metadata:
  name: niles-config
data:
  # Placeholder — overlays override via configMapGenerator with behavior: replace.
  niles.toml: |
    [home]
    name = "your home name"
    latitude = 0.0
    longitude = 0.0
    timezone = "UTC"

    [mqtt]
    host = "mosquitto.home-automation.svc.cluster.local"
    port = 1883
    username_env = "NILES_MQTT_USERNAME"
    password_env = "NILES_MQTT_PASSWORD"

    [api]
    bind_address = "0.0.0.0:8080"

    # Signing in. Off until `allowed` names somebody, which is also how
    # the first person gets in: open Settings on the house network, add
    # yourself under People, and it switches on from that moment.
    #
    # Needs a GitHub OAuth app whose callback URL is
    # <your niles url>/auth/github/callback.
    #
    # [auth]
    # github_client_id_env = "NILES_GITHUB_CLIENT_ID"
    # github_client_secret_env = "NILES_GITHUB_CLIENT_SECRET"
    # session_secret_env = "NILES_SESSION_SECRET"
    # Optional: Niles makes an API key and keeps it (Settings → API
    # access). Name a variable only to set the key from the deployment.
    # api_token_env = "NILES_API_TOKEN"
    # allowed = [{ email = "you@example.com", speaker = "you" }]

    [wyoming]
    bind_address = "0.0.0.0:10300"

    # Who hears and who thinks: ElevenLabs and Cerebras by default. Niles
    # builds both clients at startup, so a first start reads their keys
    # from these variables. Settings → Voice & AI changes the providers.
    [stt]
    api_key_env = "ELEVENLABS_API_KEY"

    [llm]
    api_key_env = "CEREBRAS_API_KEY"

    [tts]
    base_url = "http://piper.home-automation.svc.cluster.local:5000"

