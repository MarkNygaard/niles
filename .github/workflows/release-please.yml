name: release-please

# Keeps a release PR open against development: the next version, worked
# out from the Conventional-Commits titles merged since the last
# release, and the changelog. Merging it tags the release and publishes
# it on GitHub. The image for a release is built when development is
# merged into main (see image.yml), not here.
#
# Each add-on in addons/ is released on its own, with its own release PR
# and tags like spotprice-v0.1.0 (release-please-config.json). Niles's
# own tags stay vX.Y.Z. When an add-on's release is published, the
# addon-assets job attaches its files (addon-release.yml).
#
# The token: a PR opened with the workflow's own GITHUB_TOKEN starts no
# workflows, so CI would never report on the release PR and the
# development ruleset, which requires CI, would hold it. A fine-grained
# token in RELEASE_PLEASE_TOKEN (this repository: contents and pull
# requests, read and write) lets CI run on it. Without one this still
# works, and the release PR is merged through the admin bypass.
on:
  push:
    branches: [development]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
      addon_tags: ${{ steps.addons.outputs.tags }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: development
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The tags of the add-on releases just made, as a JSON list. The
      # action names each package's outputs after its path, like
      # addons/spotprice--tag_name.
      - name: Add-on releases
        id: addons
        env:
          OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: |
          tags=$(jq -c '[to_entries[] | select(.key | test("^addons/[^/]+--tag_name$")) | .value]' <<< "$OUTPUTS")
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  addon-assets:
    needs: release-please
    if: needs.release-please.outputs.addon_tags != '[]'
    strategy:
      matrix:
        tag: ${{ fromJSON(needs.release-please.outputs.addon_tags) }}
    uses: ./.github/workflows/addon-release.yml
    with:
      tag: ${{ matrix.tag }}
    permissions:
      contents: write

  # release-please moves the version in Cargo.toml (the workspace's, or
  # an add-on's); the lock file names the crate at that version too, and
  # is left to cargo to put right, on each release PR's own branch.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.release-please.outputs.prs) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.pr.headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Bring the lock files to the new version
        run: |
          cargo update --workspace
          (cd addons && cargo update --workspace)
          if git diff --quiet -- Cargo.lock addons/Cargo.lock; then
            echo "The lock files already agree."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock addons/Cargo.lock
          git commit -m "chore: Cargo.lock for the release"
          git push
