name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .claude/skills is a copy of .agents/skills: the repo has no
      # symlinks, so this is what keeps the copy from drifting.
      - name: Skills copies match
        run: python3 scripts/check-skills.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # MANIFEST.md freshness is `committed_manifest_matches_features_toml`
      # in niles-bin, run by `cargo test` above.

      # Not on PRs: the code has already compiled and passed its tests,
      # so all this adds is a release-only build failure, which main
      # still catches before the image does.
      - name: cargo build --release
        if: github.event_name == 'push'
        run: cargo build --workspace --release

  web:
    name: web ui (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck + bundle
        working-directory: web
        run: bun run build

      - name: Test
        working-directory: web
        run: bun run test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # The `ui` feature is off by default, so the embedding code is not
      # compiled by the job above. Without this it would rot unnoticed
      # until an image build failed.
      - name: cargo test --features ui
        run: |
          cargo test -p niles-api --features ui
          cargo check -p niles-bin --features ui

  site:
    name: site (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: site
        run: bun run typecheck

      # Needs no network: without the add-on index the build still passes,
      # and the add-ons page loads the index in the browser instead.
      - name: Build
        working-directory: site
        run: bun run build
