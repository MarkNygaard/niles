name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: fmt + clippy + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .claude/skills is a copy of .agents/skills: the repo has no
      # symlinks, so this is what keeps the copy from drifting.
      - name: Skills copies match
        run: python3 scripts/check-skills.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # MANIFEST.md freshness is `committed_manifest_matches_features_toml`
      # in niles-bin, run by `cargo test` above.

      # Not on PRs: the code has already compiled and passed its tests,
      # so all this adds is a release-only build failure, which main
      # still catches before the image does.
      - name: cargo build --release
        if: github.event_name == 'push'
        run: cargo build --workspace --release

  web:
    name: web ui (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck + bundle
        working-directory: web
        run: bun run build

      - name: Test
        working-directory: web
        run: bun run test

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      # The `ui` feature is off by default, so the embedding code is not
      # compiled by the job above. Without this it would rot unnoticed
      # until an image build failed.
      - name: cargo test --features ui
        run: |
          cargo test -p niles-api --features ui
          cargo check -p niles-bin --features ui

  # The first-party add-ons in addons/, a workspace of their own: each is
  # built to WebAssembly and checked by `niles plugin check` as an install
  # would check it. Not a required check. It runs on every push and PR
  # like the jobs above, with no path filter, because what it checks
  # moves with the WIT and the plugin runtime as much as with addons/.
  addons:
    name: addons (build + check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            addons -> target

      - name: cargo fmt --check (add-ons)
        working-directory: addons
        run: cargo fmt --all --check

      - name: cargo clippy (add-ons)
        working-directory: addons
        run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings

      - name: Build the add-ons
        run: addons/build.sh

      - name: Build niles
        run: cargo build -p niles-bin

      - name: niles plugin check
        run: |
          for manifest in addons/*/niles-integration.toml; do
            target/debug/niles plugin check "${manifest%/niles-integration.toml}"
          done

  # deploy/compose as a household would run it, on the image this commit
  # builds: Niles comes up beside its Postgres and reaches it. Not a
  # required check. The image build is most of its time, about as long
  # as image.yml takes (10 to 13 minutes).
  compose:
    name: compose (up + healthz)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Loaded into the runner's Docker rather than pushed, and given a
      # name no registry has, so the stack can only run this build.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: niles:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The household's broker is outside the stack. Here it is a
      # Mosquitto beside it, which takes any login, and the shipped
      # niles.toml with only the broker's address changed.
      - name: Write the CI override and settings
        run: |
          sed 's/^host = .*/host = "mosquitto"/' deploy/compose/niles.toml > "$RUNNER_TEMP/niles.toml"
          cat > "$RUNNER_TEMP/compose.ci.yaml" <<EOF
          services:
            mosquitto:
              image: eclipse-mosquitto:2
              command: mosquitto -c /mosquitto-no-auth.conf
              healthcheck:
                test: ["CMD", "mosquitto_pub", "-t", "ci/health", "-m", "ok"]
                interval: 5s
                timeout: 5s
                retries: 10
            niles:
              depends_on:
                mosquitto:
                  condition: service_healthy
              volumes:
                - $RUNNER_TEMP/niles.toml:/etc/niles/niles.toml:ro
          EOF
          {
            echo "NILES_IMAGE=niles:ci"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "NILES_SECRET_KEY=$(openssl rand -base64 32)"
            echo "NILES_MQTT_USERNAME=ci"
            echo "NILES_MQTT_PASSWORD=ci"
            # Never called: nothing speaks to this Niles.
            echo "ELEVENLABS_API_KEY=ci-not-a-key"
            echo "CEREBRAS_API_KEY=ci-not-a-key"
          } > "$RUNNER_TEMP/ci.env"

      - name: docker compose up
        run: >-
          docker compose
          -f deploy/compose/compose.yaml
          -f "$RUNNER_TEMP/compose.ci.yaml"
          --env-file "$RUNNER_TEMP/ci.env"
          up -d --wait --wait-timeout 180

      - name: /healthz answers
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:8080/healthz

      # With a database and a secrets key, Niles makes an API key at its
      # first start, seals it into Postgres and reads it back, and only
      # then reports it as stored. That takes both the database and the
      # key working. The response holds the key, so none of it is printed.
      - name: Niles reached its database
        run: |
          curl -fsS http://127.0.0.1:8080/auth/api-token \
            | jq -e '.writable == true and .source == "stored"' > /dev/null

      - name: Logs
        if: failure()
        run: >-
          docker compose
          -f deploy/compose/compose.yaml
          -f "$RUNNER_TEMP/compose.ci.yaml"
          --env-file "$RUNNER_TEMP/ci.env"
          logs --no-color

      - name: docker compose down
        if: always()
        run: >-
          docker compose
          -f deploy/compose/compose.yaml
          -f "$RUNNER_TEMP/compose.ci.yaml"
          --env-file "$RUNNER_TEMP/ci.env"
          down -v

  site:
    name: site (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: site
        run: bun run typecheck

      # Needs no network: without the add-on index the build still passes,
      # and the add-ons page loads the index in the browser instead.
      - name: Build
        working-directory: site
        run: bun run build
