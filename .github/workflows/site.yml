name: Site

# getniles.app: the landing page, the docs and the add-on library, built from
# site/ and published to GitHub Pages. The daily run picks up add-ons the
# library gained since the last release.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      # main is what is released. A scheduled run starts from the default
      # branch (development), so the ref is named rather than inherited.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/configure-pages@v6

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: site
        env:
          NEXT_PUBLIC_SITE_URL: https://getniles.app
        run: bun run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
