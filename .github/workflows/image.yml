name: image

# Build + push the niles container image to GHCR.
# - A merge into main (development → main) → `sha-<sha>` + `latest`, and
#   the version (`0.4.0`) when what was merged is a release: the commit
#   development was at carries release-please's tag (see
#   release-please.yml). Unreleased work reaching main gets no version,
#   so a version always names exactly one build.
# - Manual run (workflow_dispatch) → `sha-<sha>`, and `latest` from main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: build + push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, to tell whether this is a release.
          fetch-depth: 0

      # A merge into main has development's commit as its second
      # parent; a push straight to main (an admin bypass) has none.
      - name: Release version
        id: version
        run: |
          merged=$(git rev-parse -q --verify HEAD^2 || git rev-parse HEAD)
          tag=$(git tag --points-at "$merged" --list 'v*' | sort -V | tail -n 1)
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-none}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # github.repository ("MarkNygaard/niles") is lowercased by the action.
          images: ghcr.io/${{ github.repository }}
          # Not `is_default_branch`: that is development now, and
          # `latest` is what main last released.
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The speaker model, when there is one. Repository variables
          # rather than secrets: a URL and a checksum are not secret,
          # and a secret would be masked out of the build log at
          # exactly the moment somebody is working out why it failed.
          # Unset is the normal case and builds an image without it.
          build-args: |
            ECAPA_URL=${{ vars.ECAPA_URL }}
            ECAPA_SHA256=${{ vars.ECAPA_SHA256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
