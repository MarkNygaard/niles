[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Mark Nygaard Leth <mnl@dilling.com>"]

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.dependencies]
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Intra-workspace crate dependencies. Add a `crate.workspace = true` line in
# any crate that depends on another workspace crate.
niles-scheduler = { path = "crates/niles-scheduler" }
