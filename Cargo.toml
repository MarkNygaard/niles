[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Mark Nygaard Leth <47065655+MarkNygaard@users.noreply.github.com>"]

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.dependencies]
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "signal", "io-util", "net"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
rumqttc = "0.25"
dotenvy = "0.15"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# rustls-tls keeps us off platform OpenSSL — same call cross-platform
# and what CI Ubuntu would need anyway. Multipart is for Whisper's
# audio-upload endpoint.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
# Date / time. `clock` gives us the system clock; we skip the rest of
# the default features (notably `oldtime`, `wasmbind`) to keep deps
# tight. `chrono-tz` ships the IANA database so we can resolve
# `cfg.home.timezone` strings like "Europe/Copenhagen".
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
# This machine's zone, for `niles plugin dev`'s `config.time-zone`.
# chrono's `clock` feature already depends on it.
iana-time-zone = "0.1"
ndarray = "0.17"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "load-dynamic", "api-24", "tls-rustls"] }
realfft = "3"
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde_yaml = "0.9"
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
hound = "3"
fs2 = "0.4"
urlencoding = "2"
html2text = "0.17"
aes-gcm = "0.11"
base64 = "0.23"
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
rand_chacha = "0.10"
parking_lot = "0.12"
hmac = "0.13"
sha2 = "0.11"
# Web Push: P-256 for the message key agreement (RFC 8291) and the
# VAPID signature (RFC 8292). Pure Rust, the same RustCrypto generation
# as aes-gcm, sha2 and hmac above, so nothing here brings OpenSSL in.
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std", "precomputed-tables"] }
hkdf = "0.13"
hex = "0.4"
roxmltree = "0.20"
# Third-party plugins are WebAssembly components (component model, WASI
# 0.2). Only what running them needs: no wasm text format, no on-disk
# cache, no profiling, no WASI preview 1 or 3.
wasmtime = { version = "49.0.3", default-features = false, features = ["cranelift", "runtime", "component-model", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.3", default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "49.0.3", default-features = false, features = ["p2", "default-send-request"] }
semver = "1"
url = "2"
bytes = "1"
# Pictures kept for artifacts: decoded and written again, never kept as
# they came. Pure Rust, and only the four formats a picture arrives in.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# Intra-workspace crate dependencies. Add a `crate.workspace = true` line in
# any crate that depends on another workspace crate.
niles-core = { path = "crates/niles-core" }
niles-config = { path = "crates/niles-config" }
niles-db = { path = "crates/niles-db" }
niles-mqtt = { path = "crates/niles-mqtt" }
niles-api = { path = "crates/niles-api" }
niles-scheduler = { path = "crates/niles-scheduler" }
niles-groceries = { path = "crates/niles-groceries" }
niles-nemlig = { path = "crates/niles-nemlig" }
niles-speakers = { path = "crates/niles-speakers" }
niles-webos = { path = "crates/niles-webos" }
niles-tls = { path = "crates/niles-tls" }
niles-wyoming = { path = "crates/niles-wyoming" }
niles-stt = { path = "crates/niles-stt" }
niles-tts = { path = "crates/niles-tts" }
niles-intent = { path = "crates/niles-intent" }
niles-llm = { path = "crates/niles-llm" }
niles-tools = { path = "crates/niles-tools" }
niles-capabilities = { path = "crates/niles-capabilities" }
niles-history = { path = "crates/niles-history" }
niles-memory = { path = "crates/niles-memory" }
niles-skills = { path = "crates/niles-skills" }
niles-recognition = { path = "crates/niles-recognition" }
niles-weather = { path = "crates/niles-weather" }
niles-calendar = { path = "crates/niles-calendar" }
niles-websearch = { path = "crates/niles-websearch" }
niles-notifications = { path = "crates/niles-notifications" }
niles-presence = { path = "crates/niles-presence" }
niles-automations = { path = "crates/niles-automations" }
niles-integration-linear = { path = "crates/niles-integration-linear" }
niles-mcp = { path = "crates/niles-mcp" }
niles-plugins = { path = "crates/niles-plugins" }
niles-training = { path = "crates/niles-training" }
niles-artifacts = { path = "crates/niles-artifacts" }
niles-webpush = { path = "crates/niles-webpush" }

# Every niles-plugins test compiles a component with Cranelift, and an
# unoptimised Cranelift made those tests most of CI's `cargo test`.
# Optimising the compiler, not our code, keeps debug builds debuggable.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3
