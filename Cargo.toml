[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Mark Nygaard Leth <mnl@dilling.com>"]

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.dependencies]
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "signal"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rumqttc = "0.24"
dotenvy = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Intra-workspace crate dependencies. Add a `crate.workspace = true` line in
# any crate that depends on another workspace crate.
niles-core = { path = "crates/niles-core" }
niles-config = { path = "crates/niles-config" }
niles-mqtt = { path = "crates/niles-mqtt" }
niles-scheduler = { path = "crates/niles-scheduler" }
