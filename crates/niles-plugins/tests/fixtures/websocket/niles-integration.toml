id = "wsfixture"
name = "WebSocket fixture"
version = "0.1.0"
description = "Exercises host managed WebSocket transport."
authors = ["Niles tests"]
min_niles = "0.4.0"
interface = "0.4"
keywords = ["websocket"]

[permissions]
tools = true
websocket = [{ name = "local", host = "setting:address", port = 8088, tls = false }]

[[settings]]
key = "address"
label = "WebSocket address"
type = "string"
[[settings]]
key = "url"
label = "WebSocket URL"
type = "string"
