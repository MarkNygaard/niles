# The interface 0.3 plugin the accounts-and-webhooks tests load: a bed
# mat that connects an account and is told by a webhook. Built to
# `../sleepmat.wasm` by `build.sh` / `build.ps1`, and the built component
# is committed, so the tests need no WebAssembly toolchain.
[package]
name = "niles-plugin-sleepmat"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Its own workspace: it is built for wasm32-wasip2, never with Niles.
[workspace]
