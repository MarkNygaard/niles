[package]
name = "niles-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
tracing.workspace = true
axum = { workspace = true, features = ["ws"] }
niles-core.workspace = true
niles-config.workspace = true
toml.workspace = true
niles-mqtt.workspace = true
niles-notifications.workspace = true
niles-db.workspace = true
niles-presence.workspace = true
niles-scheduler.workspace = true
niles-integration-linear.workspace = true
async-trait.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing-subscriber.workspace = true
rust-embed = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
reqwest.workspace = true
hmac.workspace = true
sha2.workspace = true
rand.workspace = true

[features]
# Embeds the built web UI (web/dist) into the binary. Off by default so
# the ordinary `cargo build` needs no JavaScript toolchain; the container
# image builds with it on.
ui = ["dep:rust-embed", "dep:mime_guess"]

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
hex.workspace = true