# Niles example config. Copy to ./niles.toml (gitignored) and edit values.
#
# Secrets never live in this file — TOML carries env-var *names*, and
# the runtime resolves them at startup. For local dev, put the values
# in .env at the repo root (also gitignored). For a k8s deploy, mount
# them via a Secret.

[home]
name = "your home name"
latitude = 56.1572
longitude = 10.2107
timezone = "Europe/Copenhagen"

[mqtt]
# Broker reachable from where you run `niles`. For a cluster deploy
# this is the in-cluster service DNS; for local dev pointed at a
# cluster broker, use the LoadBalancer/NodePort IP.
host = "127.0.0.1"
port = 1883
# Real credentials live in NILES_MQTT_USERNAME / NILES_MQTT_PASSWORD,
# loaded from .env in local dev or a k8s Secret in deploy.
username_env = "NILES_MQTT_USERNAME"
password_env = "NILES_MQTT_PASSWORD"
# Optional overrides (defaults shown):
# client_id   = "niles"
# z2m_prefix  = "zigbee2mqtt"

[api]
# HTTP API server bind address. `0.0.0.0` listens on all interfaces
# (handy for cluster deploy + local curl); use `127.0.0.1` to scope
# to localhost only.
bind_address = "0.0.0.0:8080"

[wyoming]
# Wyoming voice-protocol server bind address. Port 10300 is the
# convention used by Home Assistant satellites and ESPHome's
# voice_assistant component — match it unless you have a reason
# not to.
bind_address = "0.0.0.0:10300"

[stt]
# Speech-to-text provider. The API key itself lives in the env var
# named here (GROQ_API_KEY in .env for local dev, or a k8s Secret in
# cluster deploy) — never in this file.
api_key_env = "GROQ_API_KEY"
# Optional overrides (defaults shown):
# base_url        = "https://api.groq.com/openai/v1"
# model           = "whisper-large-v3-turbo"
# language        = "en"     # ISO-639-1; omit to auto-detect
# timeout_seconds = 30

[tts]
# Text-to-speech provider. Piper runs in-cluster, so no API key —
# just the service URL. Voices ship with the Piper image; pick one
# that's pre-baked or mount more via a PVC.
# Optional overrides (defaults shown):
# base_url      = "http://piper.home-automation.svc.cluster.local:5000"
# default_voice = "en_GB-alan-medium"
# timeout_seconds = 30

[llm]
# Tier 1 LLM provider (Groq GPT-OSS by default). The API key itself
# lives in the env var named here (GROQ_API_KEY in .env for local
# dev, or a k8s Secret in cluster deploy) — never in this file.
# Independent of [stt]'s api_key_env so providers can be split.
api_key_env = "GROQ_API_KEY"
# Optional overrides (defaults shown):
# base_url        = "https://api.groq.com/openai/v1"
# model           = "openai/gpt-oss-20b"
# timeout_seconds = 30

# Optional satellite → room mapping. Each entry maps a satellite's
# LAN IP to a canonical room name. Niles uses this to tell the LLM
# which room a voice command originated from, so ambiguous requests
# like "turn on the lights" default to the right room.
#
# [satellites.living_room_sat]
# ip = "192.168.1.10"
# room = "living_room"
#
# [satellites.kitchen_sat]
# ip = "192.168.1.20"
# room = "kitchen"

# Optional Tier B capability reference directory. If set, niles loads
# every `<directory>/<name>/SKILL.md` at startup and registers the
# `look_up_capability` tool so the LLM can pull a capability's full
# markdown body on demand. Missing/empty/unreadable — niles starts
# without the tool and logs the cause.
#
# [capabilities]
# directory = "docs/capabilities"

# Optional. Where Niles keeps the config changes made through the web UI
# and by voice, so they survive a restart. Without this section, and
# without [persistence], those changes apply immediately but are lost when
# the process exits — Niles says so at startup.
#
# url_env names the environment variable holding the connection string; it
# is never the string itself, which would put a password in this file.
# [database]
# url_env = "NILES_DATABASE_URL"
# max_connections = 5

# The order the rooms sit in on the dashboard's front page, by room name.
# A house has an order its rooms are thought about in and it is never the
# alphabet, which is what the page sorts by otherwise. Rooms left out keep
# the alphabet and follow the ones listed, so a newly paired room appears
# at the end rather than not at all. Easier set by dragging the list in
# Settings than typed here.
# [rooms]
# order = ["living_room", "kitchen", "office"]

# Lights that should sit out the adaptive curve — a TV backlight, a shelf
# strip — and hold a fixed warm, dim setting instead. List them here; set
# how they look with `ambient_brightness` / `ambient_kelvin` under
# [lighting]. Changing this list needs a restart: it is wired into the
# device sources at startup. The brightness and colour are live.
# [ambient_lights]
# devices = ["living_room/tv_light", "bedroom/shelf_strip"]

[lighting]
# Times are HH:MM in local wall-clock. See ARCHITECTURE.md for the
# semantics of each phase.
morning_start = "05:45"
morning_end   = "06:30"
sunset_start  = "21:30"
sunset_end    = "23:00"
night_floor_brightness = 15
# Held by lights listed in [ambient_lights]. Omit both and those lights are
# left alone entirely.
# ambient_brightness = 25
# ambient_kelvin = 2200
daytime_brightness     = 100

# Color temperature anchors throughout the day. Linear interpolation
# between adjacent anchors; outside the anchor range, the nearest
# anchor value is used.
[[lighting.color_temp_anchors]]
time = "00:00"
kelvin = 2000

[[lighting.color_temp_anchors]]
time = "05:45"
kelvin = 2000

[[lighting.color_temp_anchors]]
time = "06:30"
kelvin = 2700

[[lighting.color_temp_anchors]]
time = "12:00"
kelvin = 4500

[[lighting.color_temp_anchors]]
time = "17:00"
kelvin = 3500

[[lighting.color_temp_anchors]]
time = "21:30"
kelvin = 2700

[[lighting.color_temp_anchors]]
time = "23:00"
kelvin = 2000

[[lighting.color_temp_anchors]]
time = "23:59"
kelvin = 2000

# Optional morning auto-on routine. If omitted, no light is auto-turned-on.
# Lights in `target_devices` are claimed at `morning_start` and driven through
# a 0% → 100% brightness ramp over [morning_start, morning_end] (the curve
# window) on weekdays matching `fire_days`. Dates in `skip_overrides` disable
# the routine for that day only.
#
# [lighting.morning_routine]
# fire_days = ["mon", "tue", "wed", "thu", "fri"]
# target_devices = ["z2m:bedroom/ceiling_light", "z2m:hallway/main"]
# skip_overrides = ["2026-12-25", "2026-12-31"]

# Optional ambient-light opt-out. Devices listed here are excluded
# from the ambient lighting curve and the morning routine, while all
# other subsystems (voice, switch, scenes, HTTP API) continue to treat
# them as normal lights.
#
# [ambient_lights]
# devices = ["living_room/tv_lightstrip"]

# Who is home, from tado's geofencing.
#
# There are no credentials here. tado removed the password grant in
# March 2025; what replaced it is a one-time approval in a browser, and
# the refresh token it yields is written to Postgres — so `[database]`
# has to be configured or this stays off.
#
# On first start Niles logs a URL and a code at WARN. Open the URL,
# approve the code, and that is the last time anyone has to.
# [presence]
# enabled = true
# # Five minutes. tado rate-limits per day and resets around midday
# # Berlin time; a minute's polling spends the budget before evening.
# poll_seconds = 300
# # How long everyone has to be gone before the house counts as away.
# away_debounce_minutes = 5
#
# # What presence does besides answer the question. Both are off until
# # somebody says otherwise: switching presence on to know whether the
# # house is empty should not also hand it the light switches. Easier
# # set from the tado card in Settings than typed here.
# #
# # Off takes whatever is on at the moment the last person goes; a light
# # already off, or one that has never reported, is left alone. On names
# # its lights, because arriving is not the same shape of event as
# # leaving — the hall and the kitchen, not the whole house.
# lights_off_when_away = true
# lights_on_when_home = ["hall/lamp", "kitchen/ceiling"]
#
# [presence.tado]
# # Discovered from /api/v2/me. Only worth setting if the account has
# # more than one home.
# # home_id = 123456
