<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: installed on iOS the page owns the whole
         screen, including behind the status bar and home indicator, and
         globals.css keeps clear of both with safe-area insets.
         interactive-widget=resizes-content: the on-screen keyboard
         shrinks the page rather than scrolling it out from under itself. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Niles</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Overwritten before first paint by the script below, and again
         whenever the preference changes. -->
    <meta name="theme-color" content="#0a0a0a" />

    <!--
      Runs before the stylesheet paints, because the alternative is a
      dark-mode phone flashing the light theme for as long as the
      bundle takes to load. Duplicated from lib/theme.ts on purpose:
      nothing that ships in the bundle can run this early.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("niles-theme");
          var dark =
            stored === "dark" ||
            ((stored !== "light") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? "#0a0a0a" : "#f7f7f8");
        } catch (e) {
          /* Private windows throw on localStorage; the media query alone
             is a fine answer. */
        }
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Light status-bar text, drawn over the page. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Niles" />

    <!-- iOS reads only this one, and ignores the manifest's icons. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!--
      Launch images, portrait, for the iPhones still in use. iOS matches
      on exact CSS dimensions and ignores anything that does not, so a
      device missing from this list falls back to the manifest's
      background_color — a plain dark screen rather than a broken one,
      which is why the list does not have to be exhaustive.
    -->
    <!-- iPhone SE (3rd gen), 8 -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-750x1334.png"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <!-- iPhone 11, XR -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-828x1792.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    />
    <!-- iPhone X, XS, 11 Pro, 12 mini, 13 mini -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- iPhone 12, 12 Pro, 13, 13 Pro, 14 -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- iPhone 14 Pro, 15, 15 Pro, 16 -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1179x2556.png"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- iPhone 16 Pro -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1206x2622.png"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- iPhone XS Max, 11 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1242x2688.png"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- iPhone 12 Pro Max, 13 Pro Max, 14 Plus -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1284x2778.png"
      media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- iPhone 14 Pro Max, 15 Plus, 15 Pro Max, 16 Plus -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <!-- iPhone 16 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      href="/splash-1320x2868.png"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
